# Deux conteneurs : l'application et Ollama (le modèle de langage).
#
# ATTENTION : non essayé sur la machine de développement (pas de Docker).
#
#     docker compose up --build -d
#     docker compose exec ollama ollama pull gemma3:4b      (une seule fois)
#     puis ouvrir http://127.0.0.1:8000
#
#     docker compose exec app python -m app.check           (diagnostic)

services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama        # les modèles téléchargés survivent aux redémarrages
    restart: unless-stopped

  app:
    build: .
    environment:
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434   # "ollama" = le nom du conteneur ci-dessus
      OLLAMA_MODEL: gemma3:4b
    ports:
      # "127.0.0.1:" = joignable uniquement depuis la machine qui héberge Docker.
      # L'application n'a pas de mot de passe : ne retire ce préfixe que derrière
      # un accès protégé (VPN, reverse proxy avec authentification).
      - "127.0.0.1:8000:8000"
    volumes:
      - ./outputs:/app/outputs      # les CV standardisés (données personnelles)
      - ./logs:/app/logs
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama:
